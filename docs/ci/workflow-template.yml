name: CI

on:
  push:
    branches: [ master, "refactor/*" ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run headless tests
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          pytest -v
